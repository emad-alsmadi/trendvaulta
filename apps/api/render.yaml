services:
  # TrendVaulta Backend API
  - type: web
    name: trendvaulta-api
    env: node
    plan: free
    region: oregon
    runtime: node
    # If this Blueprint is applied from the monorepo root, uncomment:
    # rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    # Environment Variables (set secrets in Render Dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: trendvaulta
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FROM_EMAIL
        value: noreply@trendvaulta.com
      - key: FROM_NAME
        value: TrendVaulta
      - key: FRONTEND_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

# TrendVaulta  notes:
# - Liveness: GET /api/trendvaulta
# Database: MongoDB Atlas (external) — set MONGO_URL in the Render dashboard
