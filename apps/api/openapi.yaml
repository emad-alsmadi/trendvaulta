          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        email: { type: string }
                        username: { type: string }
                        roles:
                          type: array
                          items: { type: string }
                        emailVerified: { type: boolean }
                        createdAt: { type: string, format: date-time }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID (admin)
      operationId: getUserById
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: User details }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update user (admin)
      operationId: updateUser
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                username: { type: string }
                roles:
                  type: array
                  items: { type: string, enum: [user, admin, moderator] }
                isActive: { type: boolean }
      responses:
        '200': { description: User updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Delete user (admin)
      operationId: deleteUser
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: User deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ AdminStats --
  /admin/stats:
    get:
      tags: [AdminStats]
      summary: Get admin dashboard stats
      operationId: getAdminStats
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOrders: { type: integer }
                  totalRevenue: { type: number }
                  totalProducts: { type: integer }
                  totalUsers: { type: integer }
                  pendingOrders: { type: integer }
                  lowStockProducts: { type: integer }
                  recentOrders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/analytics:
    get:
      tags: [AdminStats]
      summary: Get sales analytics
      operationId: getAdminAnalytics
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema:
            { type: string, enum: [day, week, month, year], default: month }
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  revenue:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        amount: { type: number }
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/low-stock:
    get:
      tags: [AdminStats]
      summary: Get low stock products
      operationId: getLowStockProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: threshold
          in: query
          schema: { type: integer, default: 5 }
      responses:
        '200':
          description: Low stock products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------- Settings --
  /admin/settings:
    get:
      tags: [Settings]
      summary: Get store settings
      operationId: getSettings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Store settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  storeName: { type: string }
                  storeEmail: { type: string }
                  storePhone: { type: string }
                  storeAddress: { type: string }
                  currency: { type: string }
                  timezone: { type: string }
                  socialLinks:
                    type: object
                    properties:
                      facebook: { type: string }
                      instagram: { type: string }
                      twitter: { type: string }
                  maintenanceMode: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      summary: Update store settings
      operationId: updateSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storeName: { type: string }
                storeEmail: { type: string, format: email }
                storePhone: { type: string }
                storeAddress: { type: string }
                currency: { type: string }
                timezone: { type: string }
                socialLinks: { type: object }
                maintenanceMode: { type: boolean }
      responses:
        '200': { description: Settings updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------- Recommendations --
  /recommendations:
    get:
      tags: [Recommendations]
      summary: Get product recommendations
      operationId: getRecommendations
      parameters:
        - name: productId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Recommended products
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }

  # --------------------------------------------------------- RecentlyViewed --
  /me/recently-viewed:
    post:
      tags: [RecentlyViewed]
      summary: Track recently viewed product
      operationId: trackRecentlyViewed
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: Tracked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [RecentlyViewed]
      summary: Get recently viewed products
      operationId: getRecentlyViewed
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Recently viewed products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------- Sitemap --
  /sitemap.xml:
    get:
      tags: [Sitemap]
      summary: Get sitemap index
      operationId: getSitemapIndex
      responses:
        '200':
          description: Sitemap index XML
          content:
            application/xml:
              schema: { type: string }

  /sitemaps/{file}:
    get:
      tags: [Sitemap]
      summary: Get sitemap shard
      operationId: getSitemapShard
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sitemap XML
          content:
            application/xml:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------- Ops --
  /trendvaulta:
    get:
      tags: [Ops]
      summary: Liveness check
      operationId: getTrendvaulta
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: trendvaulta-api }
                  timestamp: { type: string, format: date-time }

  /ready:
    get:
      tags: [Ops]
      summary: Readiness check
      operationId: getReady
      responses:
        '200':
          description: Service is ready (MongoDB connected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  service: { type: string }
                  db: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
        '503':
          description: Service not ready (MongoDB disconnected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_ready }
                  service: { type: string }
                  db: { type: string, example: disconnected }
                  timestamp: { type: string, format: date-time }

  # ------------------------------------------------------------- Webhooks --
  /webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Stripe webhook endpoint
      description: |
        Raw-body endpoint (mounted outside `/api` JSON parsing). Signature
        verified with `STRIPE_WEBHOOK_SECRET`; events are idempotent via
        `StripeWebhookEvent` claims. `checkout.session.completed` marks the
        order paid and applies side effects (stock, coupon, sales count,
        invoice, confirmation email) — atomically on replica sets.
      operationId: stripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: '`{ received: true }` (duplicates also return 200)'
        '400': { description: Invalid signature/payload }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing/invalid/expired token or revoked session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but missing the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: Wrong email/password (`INVALID_CREDENTIALS`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code: { type: string, example: VALIDATION_ERROR }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        requestId: { type: string }

    AuthSession:
      type: object
      properties:
        _id: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        roles:
          type: array
          items: { type: string, enum: [user, admin, moderator] }
        emailVerified: { type: boolean }
        token:
          type: string
          description: 15-minute access JWT
        refreshToken:
          type: string
          description: Rotating refresh token

    Address:
      type: object
      required: [name, phone, address, city, zip]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        phone: { type: string, minLength: 6, maxLength: 30 }
        address: { type: string, minLength: 5, maxLength: 300 }
        city: { type: string, minLength: 2, maxLength: 100 }
        zip: { type: string, minLength: 2, maxLength: 20 }
        country:
          { type: string, minLength: 2, maxLength: 2, description: ISO alpha-2 }
        notes: { type: string, maxLength: 500 }

    OrderItemInput:
      type: object
      required: [productId, qty]
      description: Client supplies ids/qty/variant hints only — the server prices every line.
      properties:
        productId: { type: string, pattern: '^[0-9a-f]{24}$' }
        qty: { type: integer, minimum: 1 }
        variant:
          type: object
          properties:
            size: { type: string }
            color: { type: string }
            colorCode: { type: string }
            sku: { type: string }

    CreateOrderRequest:
      type: object
      required: [items, shippingAddress]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderItemInput' }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        delivery: { type: boolean, description: '`false` = pickup/digital' }
        shippingMethod: { type: string, maxLength: 50 }
        couponCode: { type: string, maxLength: 50, nullable: true }
        email:
          type: string
          format: email
          description: Required for guest checkout; ignored for signed-in users
        locale: { type: string, enum: [en, ar] }

    QuoteRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            allOf:
              - $ref: '#/components/schemas/OrderItemInput'
              - type: object
                properties:
                  price:
                    {
                      type: number,
                      minimum: 0,
                      description: Hint only — server reprices,
                    }
        couponCode: { type: string, maxLength: 50, nullable: true }
        delivery: { type: boolean }
        shippingMethod: { type: string, maxLength: 50 }
        shippingAddress:
          type: object
          properties:
            country: { type: string, minLength: 2, maxLength: 2 }
            zip: { type: string, maxLength: 20 }
            city: { type: string, maxLength: 100 }

    Product:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        brand: { type: string, description: Brand id or populated brand }
        description: { type: string }
        price: { type: number }
        basePrice: { type: number }
        cover: { type: string }
        images: { type: array, items: { type: string } }
        category:
          type: string
          enum: [makeup, perfumes, clothing, skincare, accessories, home]
        subcategory: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              size: { type: string }
              color: { type: string }
              colorCode: { type: string }
              stock: { type: integer }
              price: { type: number }
              sku: { type: string }
        stock: { type: integer }
        sku: { type: string }
        isActive: { type: boolean }
        featured: { type: boolean }
        badges:
          type: array
          items: { type: string, enum: [bestseller, new, lowStock] }
        averageRating: { type: number }
        salesCount: { type: integer }

    ProductInput:
      type: object
      required: [title, brand, description, price, cover, category, subcategory]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        brand: { type: string, pattern: '^[0-9a-f]{24}$' }
        description: { type: string, minLength: 3, maxLength: 2000 }
        price: { type: number, minimum: 0 }
        cover: { type: string }
        images: { type: array, items: { type: string } }
        category:
          type: string
          enum: [makeup, perfumes, clothing, skincare, accessories, home]
        subcategory: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              size: { type: string }
              color: { type: string }
              colorCode: { type: string }
              stock: { type: integer, minimum: 0, default: 0 }
              price: { type: number, minimum: 0 }
              sku: { type: string }
        stock: { type: integer, minimum: 0, default: 0 }
        sku: { type: string }
        isActive: { type: boolean, default: true }
        featured: { type: boolean, default: false }
        badges:
          type: array
          items: { type: string, enum: [bestseller, new, lowStock] }
        expectedUpdatedAt:
          type: string
          format: date-time
          description: Update only — optimistic concurrency token

    Order:
      type: object
      description: Serialized order; exact fields vary by endpoint (list vs detail).
      properties:
        _id: { type: string }
        user: { type: string, description: User id (absent for guest orders) }
        guestEmail: { type: string, format: email }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              title: { type: string }
              price: { type: number }
              qty: { type: integer }
              variant: { type: object }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        status:
          type: string
          enum:
            [
              pending,
              paid,
              processing,
              shipped,
              delivered,
              canceled,
              refunded,
              needs_attention,
            ]
        paymentStatus:
          type: string
          enum: [pending, paid, refunded]
        itemsPrice: { type: number }
        shippingPrice: { type: number }
        taxPrice: { type: number }
        discountAmount: { type: number }
        couponCode: { type: string }
        totalPrice: { type: number }
        invoiceNumber: { type: string }
        trackingNumber: { type: string }
        trackingCarrier: { type: string }
        trackingUrl: { type: string }
        canCancel:
          { type: boolean, description: Present on customer-facing reads }
        canReturn: { type: boolean }
        returnNeedsAccount: { type: boolean }
