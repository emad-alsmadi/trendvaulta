openapi: 3.0.3
info:
  title: TrendVaulta API
  version: 1.0.0
  description: |
    Backend API for the TrendVaulta storefront (products & brands catalog).

    Conventions:
    - All routes are mounted under `/api`.
    - Auth uses `Authorization: Bearer <token>` (15-minute access JWT).
      Refresh tokens rotate via `POST /api/auth/refresh`.
    - Success response shapes vary per controller (`{ message, data }`,
      `{ data, meta }`, bare documents) — confirm per endpoint.
    - Errors from the central handler:
      `{ success: false, message, code, details?, requestId? }`.
      Many controllers return `{ code, message }` directly instead.
    - Rate limits are IP/user keyed sliding windows (see
      `docs/RATE_LIMITING.md`).
servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://{host}/api
    description: Production
    variables:
      host:
        default: api.trendvaulta.com

tags:
  - name: Auth
  - name: Profile
  - name: Password
  - name: Products
  - name: Brands
  - name: Categories
  - name: Orders
  - name: Payments
  - name: Coupons
  - name: Reviews
  - name: Wishlist
  - name: ProductQA
  - name: Bundles
  - name: Content
  - name: Offers
  - name: HelpTopics
  - name: Lookbooks
  - name: GiftFinder
  - name: Testimonials
  - name: StorefrontModules
  - name: Storefront
  - name: Newsletter
  - name: Contact
  - name: Shipping
  - name: Uploads
  - name: Users
  - name: AdminStats
  - name: Settings
  - name: Recommendations
  - name: RecentlyViewed
  - name: Sitemap
  - name: Ops
  - name: Webhooks

paths:
  # ------------------------------------------------------------------ Auth --
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new customer account
      description: Creates a `user` account and returns access + refresh tokens. Sends a verification email (best effort).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email }
                username: { type: string, minLength: 3, maxLength: 30 }
                password: { type: string, minLength: 8 }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Email or username already exists }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: Returns access + refresh tokens. Rate-limited.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { description: Too many attempts }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      description: Exchanges a valid refresh token for a new access + refresh token pair. The old refresh token is revoked.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
        '401': { description: Invalid or expired refresh token }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (revoke refresh token)
      description: Revokes the provided refresh token. Access token remains valid until expiry.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Logged out }
        '401': { description: Invalid token }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      description: Verifies the email using the token sent during registration.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Email verified }
        '400': { description: Invalid or expired token }

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      summary: Resend verification email
      description: Sends a new verification email to the registered address.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Verification email sent }
        '429': { description: Rate limited }

  # ---------------------------------------------------------------- Profile --
  /auth/profile:
    get:
      tags: [Profile]
      summary: Get current user profile
      operationId: getProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id: { type: string }
                  email: { type: string, format: email }
                  username: { type: string }
                  firstName: { type: string }
                  lastName: { type: string }
                  roles:
                    type: array
                    items: { type: string }
                  emailVerified: { type: boolean }
                  addresses:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Profile]
      summary: Update current user profile
      operationId: updateProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, minLength: 3, maxLength: 30 }
                email: { type: string, format: email }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '200': { description: Profile updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/locale:
    put:
      tags: [Profile]
      summary: Update user locale preference
      operationId: updateLocale
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { type: string, enum: [en, ar] }
      responses:
        '200': { description: Locale updated }
        '400': { description: Invalid locale }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/addresses:
    get:
      tags: [Profile]
      summary: List saved addresses
      operationId: getAddresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Profile]
      summary: Add a new address
      operationId: createAddress
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Address' }
      responses:
        '201': { description: Address created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/addresses/{addressId}:
    put:
      tags: [Profile]
      summary: Update a saved address
      operationId: updateAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - name: addressId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Address' }
      responses:
        '200': { description: Address updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Profile]
      summary: Delete a saved address
      operationId: deleteAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - name: addressId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: Address deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/addresses/{addressId}/default:
    patch:
      tags: [Profile]
      summary: Set address as default
      operationId: setDefaultAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - name: addressId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: Default address set }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- Password --
  /password/forgot-password:
    post:
      tags: [Password]
      summary: Request password reset link
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Reset link sent (if account exists) }
        '429': { description: Rate limited }

  /password/reset-password/{userId}/{token}:
    post:
      tags: [Password]
      summary: Reset password with token
      operationId: resetPassword
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password reset successful }
        '400': { description: Invalid or expired token }

  /password/change:
    post:
      tags: [Password]
      summary: Change password (authenticated)
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '400': { description: Current password incorrect }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------------- Products --
  /products:
    get:
      tags: [Products]
      summary: List products with filtering, facets, and pagination
      description: |
        Public catalog endpoint. Supports query params for search, category,
        brand, price range, variants, sort, and pagination. Anonymous callers
        see only active products.
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: brand
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: inStock
          in: query
          schema: { type: boolean }
        - name: onSale
          in: query
          schema: { type: boolean }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [newest, price_asc, price_desc, bestselling, rating],
            }
      responses:
        '200':
          description: Paginated product list with facets
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  facets:
                    type: object
                    properties:
                      categories: { type: object }
                      brands: { type: object }
                      priceRange: { type: object }
    post:
      tags: [Products]
      summary: Create a product (admin)
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Product created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      summary: Update a product (admin)
      operationId: updateProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Product updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Delete a product (admin)
      operationId: deleteProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: Product deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- Brands --
  /brands:
    get:
      tags: [Brands]
      summary: List all brands
      operationId: listBrands
      responses:
        '200':
          description: Brand list
          content:
            application/json:
              schema:
                type: object
                properties:
                  brands:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        name: { type: string }
                        slug: { type: string }
                        logo: { type: string }
                        description: { type: string }
                        isActive: { type: boolean }
    post:
      tags: [Brands]
      summary: Create a brand (admin)
      operationId: createBrand
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                logo: { type: string }
                description: { type: string }
                isActive: { type: boolean, default: true }
      responses:
        '201': { description: Brand created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /brands/{id}:
    get:
      tags: [Brands]
      summary: Get brand by ID
      operationId: getBrand
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200':
          description: Brand details
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id: { type: string }
                  name: { type: string }
                  slug: { type: string }
                  logo: { type: string }
                  description: { type: string }
                  isActive: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Brands]
      summary: Update a brand (admin)
      operationId: updateBrand
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                logo: { type: string }
                description: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { description: Brand updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Brands]
      summary: Delete a brand (admin)
      operationId: deleteBrand
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: Brand deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ Categories --
  /storefront/categories:
    get:
      tags: [Categories]
      summary: List storefront categories
      operationId: getStorefrontCategories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        name: { type: string }
                        slug: { type: string }
                        image: { type: string }
                        order: { type: integer }

  /categories/admin:
    get:
      tags: [Categories]
      summary: List all categories (admin)
      operationId: getAdminCategories
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All categories }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categories:
    post:
      tags: [Categories]
      summary: Create a category (admin)
      operationId: createCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                image: { type: string }
                order: { type: integer }
      responses:
        '201': { description: Category created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update a category (admin)
      operationId: updateCategory
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                image: { type: string }
                order: { type: integer }
      responses:
        '200': { description: Category updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Categories]
      summary: Delete a category (admin)
      operationId: deleteCategory
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{24}$' }
      responses:
        '200': { description: Category deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- Orders --
  /orders:
    get:
      tags: [Orders]
      summary: List all orders (admin)
      operationId: getAllOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { type: string }
        - name: paymentStatus
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders]
      summary: Create an order
      description: Creates an order with validated items, pricing, and optional coupon. Returns order details for checkout.
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
                  checkoutUrl:
                    type: string
                    description: Stripe Checkout URL (if payment required)
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/my:
    get:
      tags: [Orders]
      summary: List current user's orders
      operationId: getMyOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/guest/lookup:
    post:
      tags: [Orders]
      summary: Look up guest order by email and order ID
      description: Returns order details for guest checkout verification. Requires email and order ID.
      operationId: getGuestOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, orderId]
