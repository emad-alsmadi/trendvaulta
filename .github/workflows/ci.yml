name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale CI from an earlier commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '20'

jobs:
  api:
    name: API (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: apps/api
        env:
          NODE_ENV: test
          JWT_SECRET_KEY: ci-test-secret-not-for-production
        run: npm test

  website:
    name: Website (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/website
        run: npm run lint

      - name: Typecheck
        working-directory: apps/website
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: apps/website
        run: npm test

      - name: Build
        working-directory: apps/website
        env:
          # Placeholder — the build only needs this to resolve API client
          # code paths, not to reach a live backend.
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
        run: npm run build

  dashboard:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run type-check --workspace=packages/types && npm run type-check --workspace=packages/api-client

      - name: Lint
        working-directory: apps/dashboard
        run: npm run lint

      - name: Run tests
        working-directory: apps/dashboard
        run: npm test -- --ci

      - name: Build
        working-directory: apps/dashboard
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Real gate, but only on *critical* advisories: high-severity findings in
      # this tree are mostly transitive dev tooling with no upstream fix yet, so
      # gating on them would block every PR. Tighten to --audit-level=high once
      # the baseline is clean.
      - name: npm audit (critical)
        run: npm audit --audit-level=critical
